name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
# Least-privilege, declared explicitly: draft-release creation must not
# depend on the repository's default token permissions (spec, round-2).
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          # Release builds pin the toolchain to go.mod for reproducibility —
          # deliberately unlike ci.yml's 'stable' (which proves newest-compat).
          go-version-file: go.mod
      - name: Test (hermetic; the live half loudly skips in CI)
        shell: pwsh
        run: go vet ./... && go test -count=1 ./...
      - name: Lint installer (it ships as a release asset)
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser
          # Shipped code only: installer, module, tests. Research probes under
          # docs/research/ are frozen evidence, deliberately not linted.
          $paths = 'install.ps1', 'GitProtonBackup', 'tests'
          $findings = foreach ($p in $paths) { Invoke-ScriptAnalyzer -Path $p -Recurse -Settings .\PSScriptAnalyzerSettings.psd1 }
          if ($findings) {
            $findings | Format-Table RuleName, Severity, ScriptName, Line, Message -AutoSize | Out-String | Write-Host
            throw "PSScriptAnalyzer: $($findings.Count) finding(s)"
          }
          Write-Host 'PSScriptAnalyzer: clean'
      - name: Pester (installer tests included)
        shell: pwsh
        run: |
          Install-Module Pester -MinimumVersion 5.5 -Force -SkipPublisherCheck -Scope CurrentUser -AllowClobber
          Import-Module Pester -MinimumVersion 5.5
          # CI-only belt-and-braces on a throwaway VM — never copy to a dev
          # machine; test repos set their own repo-scoped identity (see ci.yml).
          git config --global user.email 'ci@ci'; git config --global user.name 'ci'
          Invoke-Pester -Path tests -CI
      - name: Version
        id: ver
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/*') { $v = $env:GITHUB_REF -replace '^refs/tags/','' }
          else { $v = "dev+$($env:GITHUB_SHA.Substring(0,7))" }
          "version=$v" >> $env:GITHUB_OUTPUT
      - name: Build
        shell: pwsh
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          go build -trimpath -ldflags "-X main.version=$env:VERSION" -o git-remote-proton.exe ./cmd/git-remote-proton
          # Only the last native command's exit code ends the step, so stop here
          # if the Windows build failed rather than letting the Linux build mask it.
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # The Linux helper is a static linux/amd64 binary cross-built on this
          # runner. This run: block is its own pwsh process, so these variables
          # cannot leak into any later step.
          $env:GOOS='linux'; $env:GOARCH='amd64'; $env:CGO_ENABLED='0'; go build -trimpath -ldflags "-X main.version=$env:VERSION" -o git-remote-proton-linux-amd64 ./cmd/git-remote-proton
      - name: Checksum
        shell: pwsh
        run: |
          # Both sidecars are written the same way: lowercase SHA-256, two spaces,
          # the file name, no trailing newline.
          foreach ($name in 'git-remote-proton.exe', 'git-remote-proton-linux-amd64') {
            $hash = (Get-FileHash $name -Algorithm SHA256).Hash.ToLower()
            Set-Content "$name.sha256" -Value "$hash  $name" -NoNewline
          }
      - name: Upload build artifact (dispatch dry run only — never a release)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: git-remote-proton-dev
          path: git-remote-proton*
      - name: Create DRAFT release (tag runs only)
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create $env:GITHUB_REF_NAME --draft --title $env:GITHUB_REF_NAME --notes "See CHANGELOG.md. Draft until the Windows and Linux live gates pass against these exact bytes." git-remote-proton.exe git-remote-proton.exe.sha256 install.ps1 git-remote-proton-linux-amd64 git-remote-proton-linux-amd64.sha256
