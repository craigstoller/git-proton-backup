name: CI
on:
  push: { branches: [main] }
  pull_request:
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Lint (PSScriptAnalyzer)
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser
          # Shipped and operator-run code only: installer, module, tests, and the
          # scripts/ operator tools (the drift check). Research probes under
          # docs/research/ are frozen evidence, deliberately not linted.
          $paths = 'install.ps1', 'GitProtonBackup', 'tests', 'scripts'
          $findings = foreach ($p in $paths) { Invoke-ScriptAnalyzer -Path $p -Recurse -Settings .\PSScriptAnalyzerSettings.psd1 }
          if ($findings) {
            $findings | Format-Table RuleName, Severity, ScriptName, Line, Message -AutoSize | Out-String | Write-Host
            throw "PSScriptAnalyzer: $($findings.Count) finding(s)"
          }
          Write-Host 'PSScriptAnalyzer: clean'
      - name: Manifest
        shell: pwsh
        run: Test-ModuleManifest .\GitProtonBackup\GitProtonBackup.psd1 | Out-Null
      - name: Pester
        shell: pwsh
        run: |
          Install-Module Pester -MinimumVersion 5.5 -Force -SkipPublisherCheck -Scope CurrentUser -AllowClobber
          Import-Module Pester -MinimumVersion 5.5
          # CI-only belt-and-braces on a throwaway VM. NEVER copy this to a dev
          # machine (it clobbers the real identity — happened twice in Stage 4):
          # every test-created repo sets its own repo-scoped user.email/name, and
          # the suite passes with no git identity available at all (verified
          # locally with GIT_CONFIG_GLOBAL masked, 121/121).
          git config --global user.email 'ci@ci'; git config --global user.name 'ci'
          Invoke-Pester -Path tests -CI
  go:
    strategy:
      fail-fast: false
      matrix:
        # 'stable' rather than go-version-file: go.mod declares the oldest
        # supported toolchain (the floor), and CI should prove the code still
        # builds on the newest one. Building only at the floor would let a
        # break on current Go reach main unnoticed. The third leg does build
        # at the floor (the toolchain the release workflow uses), so a break
        # at that end is caught too. A leg sets go-version or go-version-file,
        # never both; the two setup-go steps below key off which one is set.
        include:
          - { os: windows-latest, go-version: stable }
          - { os: ubuntu-latest, go-version: stable }
          - { os: ubuntu-latest, go-version-file: go.mod }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      # Exactly one of these two steps runs on each leg.
      - if: matrix.go-version
        uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go-version }}
      - if: matrix.go-version-file
        uses: actions/setup-go@v7
        with:
          go-version-file: ${{ matrix.go-version-file }}
      # Windows steps (pwsh).
      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: go build ./...
      - name: Vet (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: go vet ./...
      - name: Test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        # The repo tests are hermetic: everything above internal/transport runs
        # against transport.Fake, and the few that need real git plumbing build
        # a throwaway repo under t.TempDir(). Nothing here contacts Proton.
        run: go test -count=1 ./...
      - name: gofmt (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $unformatted = gofmt -l .
          if ($unformatted) {
            $unformatted | Write-Host
            throw "gofmt: $(@($unformatted).Count) file(s) need formatting"
          }
          Write-Host 'gofmt: clean'
      # Linux steps (bash; GitHub runs an explicit `shell: bash` as
      # `bash -eo pipefail`, so any command that may fail sits in an if or a
      # function).
      - name: Build (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: go build ./...
      - name: Vet (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: go vet ./...
      - name: Git floor (2.45.0) probe
        if: runner.os == 'Linux'
        shell: bash
        # The fetch tests need git 2.45.0 or newer: `rev-list --missing=print`
        # must report a missing tip as a `?`-line, and older git dies with "bad
        # object". The runner image usually ships a new enough git; when it
        # does not, install current git from the git-core PPA and probe again.
        # The log names the path taken ("probe: runner git" or "probe: PPA
        # git"). The probed object ID is arbitrary and expected to be absent
        # from the checkout.
        run: |
          OID=0123456789abcdef0123456789abcdef01234567
          probe() { local out; out=$(printf '%s\n' "$OID" | git rev-list --objects --missing=print --stdin 2>&1) || return 1; grep -qx "?$OID" <<<"$out"; }
          retry() { for n in 1 2 3; do "$@" && return 0; sleep 15; done; return 1; }
          git --version
          if probe; then echo "probe: runner git"; else
            retry sudo add-apt-repository -y ppa:git-core/ppa && retry sudo apt-get update && retry sudo apt-get install -y git || { echo "git floor: PPA install failed"; exit 1; }
            git --version
            if probe; then echo "probe: PPA git"; else echo "git floor: fetch tests need git 2.45.0 or newer; runner has $(git --version) (or, implausibly, the checkout holds the probe object $OID)"; exit 1; fi
          fi
      - name: Test (Linux)
        if: runner.os == 'Linux'
        shell: bash
        # Hermetic, as on Windows. The probe above has already proved the
        # runner has git 2.45.0 or newer, which the fetch tests need.
        run: go test -count=1 ./...
      - name: gofmt (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
